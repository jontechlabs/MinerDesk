[package]
name = "minerdesk"
version = "0.8.2"
description = "Cross-platform multi-miner launcher, scheduler and headless web monitor"
authors = ["MinerDesk"]
edition = "2021"
default-run = "minerdesk"

# Explicit entries keep Tauri's bundler from dropping a secondary executable
# while scanning src/bin. All three retain their original entry points.
[[bin]]
name = "minerdesk"
path = "src/main.rs"

[[bin]]
name = "minerdesk-headless"
path = "src/bin/minerdesk-headless.rs"

[[bin]]
name = "minerdesk-backend"
path = "src/bin/minerdesk-backend.rs"

[lib]
name = "minerdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
minerdesk-update-helper = { path = "update-helper" }
tauri = { version = "~2.12.1", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
base64 = "0.22"
rustls-pemfile = "2"
regex = "1"
md5 = "0.7"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
walkdir = "2"
rfd = "0.15"
shlex = "1"
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs-next = "2"
include_dir = "0.7"
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
semver = "1"
tauri-plugin-updater = "~2.13.1"
tempfile = "3"
tauri-plugin-opener = "~2.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "~2.12.1", features = ["tray-icon"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
