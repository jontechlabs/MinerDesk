name: Mobile clients and layout
on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'src/**', 'tests/**', 'scripts/mobile-*', 'package*.json', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', 'src/**', 'tests/**', 'scripts/mobile-*', 'package*.json', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
jobs:
  checks:
    name: Shared UI and mobile transport tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: npm ci --include=dev
      - run: node --test tests/*.test.cjs
      - run: npm run build
      - run: npm --prefix apps/mobile run build
      - run: cargo test --locked --manifest-path apps/mobile/core/Cargo.toml
  android:
    name: Android APK previews (debug key)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - run: npm ci --include=dev
      - name: Bootstrap the specified Android SDK tools and packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'
      - name: Select the pinned NDK for the native build
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Generate mobile brand assets from the shared source icon
        working-directory: apps/mobile
        run: npm run tauri -- icon ../../src-tauri/icons/512x512.png --output src-tauri/icons
      - name: Initialize the isolated mobile project
        working-directory: apps/mobile
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build debug-signed arm64 and x86_64 APKs
        working-directory: apps/mobile
        run: npm run tauri -- android build --debug --apk --split-per-abi --target aarch64 --target x86_64 --ci
      - name: Verify native payloads and stage preview artifacts
        run: |
          git diff --exit-code -- apps/mobile/core/Cargo.lock apps/mobile/src-tauri/Cargo.lock
          python3 scripts/mobile-artifacts.py android --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minerdesk-mobile-android-preview
          path: publish/mobile-android-preview/
          if-no-files-found: error
          retention-days: 14
  ios:
    name: iOS Simulator preview (no Apple credentials)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - run: npm ci --include=dev
      - name: Select this Mac's simulator architecture
        run: |
          case "$(uname -m)" in
            arm64) echo 'MD_IOS_TARGET=aarch64-sim' >> "$GITHUB_ENV" ;;
            x86_64) echo 'MD_IOS_TARGET=x86_64' >> "$GITHUB_ENV" ;;
            *) echo 'Unsupported simulator host architecture' >&2; exit 1 ;;
          esac
          xcodebuild -version
      - name: Generate mobile brand assets from the shared source icon
        working-directory: apps/mobile
        run: npm run tauri -- icon ../../src-tauri/icons/512x512.png --output src-tauri/icons
      - name: Initialize the isolated mobile project
        working-directory: apps/mobile
        run: npm run tauri -- ios init --ci --skip-targets-install
      - name: Build for the simulator without Apple signing credentials
        working-directory: apps/mobile
        run: npm run tauri -- ios build --debug --target "$MD_IOS_TARGET" --no-sign --ci
      - name: Verify the simulator bundle and stage preview artifacts
        run: |
          git diff --exit-code -- apps/mobile/core/Cargo.lock apps/mobile/src-tauri/Cargo.lock
          python3 scripts/mobile-artifacts.py ios --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minerdesk-mobile-ios-simulator-preview
          path: publish/mobile-ios-preview/
          if-no-files-found: error
          retention-days: 14
  layout:
    name: Mobile layout at four viewport sizes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm --prefix apps/mobile run build
      - name: Install an isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/mobile-browser-tools" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/mobile-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise production UI with synthetic TEST DATA
        run: node scripts/mobile-layout.mjs --playwright "$RUNNER_TEMP/mobile-browser-tools/node_modules/playwright/index.mjs" --output publish/mobile-layout
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: minerdesk-mobile-layout
          path: publish/mobile-layout/
          if-no-files-found: error
          retention-days: 14
