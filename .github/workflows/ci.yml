name: Build and checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', '*.md', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows x64 · tests and NSIS
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: npm ci --include=dev
      - run: npm test
      - name: Canonical Windows release build (does not run installer)
        shell: powershell
        run: .\scripts\build-windows.ps1
      - name: Rust library tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Exercise Tauri signing callbacks without a certificate (test outputs remain unsigned)
        shell: powershell
        run: .\tests\verify-signing-callback.ps1
      - name: Prepare pinned official artifact uploader for signing runtime check
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: actions/upload-artifact
          ref: ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
          path: publish/signing-runtime-test/upload-artifact
          persist-credentials: false
      - name: Verify real GitHub artifact upload from the signing callback runtime
        uses: ./.github/actions/test-signing-runtime
        env:
          MD_UPLOAD_ACTION: ${{ github.workspace }}\publish\signing-runtime-test\upload-artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: publish/windows-x64/
          if-no-files-found: error
          retention-days: 14
  linux:
    name: Linux x64 · tests and release packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev python3-lxml patchelf
      - run: npm ci --include=dev
      - name: Source invariants
        run: |
          python3 tests/verify_installer_sources.py
          python3 tests/verify_task_restart_policy.py
          python3 tests/verify_windowless_scheduler_sources.py
      - name: Build tested desktop, CLI, Debian package and AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash scripts/build-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64
          path: publish/linux-x64/
          if-no-files-found: error
          retention-days: 14
