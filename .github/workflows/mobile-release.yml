name: Android production release
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed main commit to build (40 hexadecimal characters)
        required: true
        type: string
      version:
        description: Stable mobile version already committed in the project
        default: '1.0.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-production-release
  cancel-in-progress: false
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
jobs:
  checks:
    name: Verify reviewed main and mobile release tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the exact reviewed main checkout
        env:
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_SHA" = "$REQUESTED_COMMIT"
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          commit = os.environ['REQUESTED_COMMIT']
          version = os.environ['REQUESTED_VERSION']
          if not re.fullmatch('[0-9a-f]{40}', commit):
              raise SystemExit('A complete reviewed main SHA is required')
          if not re.fullmatch(r'[1-9]\d*\.\d+\.\d+', version):
              raise SystemExit('A stable mobile version is required')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != commit:
              raise SystemExit('Checkout differs from reviewed source')
          for name in ['apps/mobile/package.json', 'apps/mobile/src-tauri/tauri.conf.json']:
              if json.loads(Path(name).read_text())['version'] != version:
                  raise SystemExit('Committed mobile version differs from requested release')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: npm ci --include=dev
      - run: node --test tests/*.test.cjs
      - run: npm run build
      - run: npm --prefix apps/mobile run build
      - run: python3 tests/mobile-artifacts.py
      - run: python3 tests/mobile-release-artifacts.py
      - run: cargo test --locked --manifest-path apps/mobile/core/Cargo.toml
  android:
    name: Production-signed arm64 and x86_64 APKs
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment: mobile-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - run: npm ci --include=dev
      - name: Bootstrap pinned Android SDK tools and packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'
      - name: Select the pinned native toolchain
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Generate the mobile launcher icons
        working-directory: apps/mobile
        run: npm run tauri -- icon ../../docs/brand/mobile/icon-manifest.json --output src-tauri/icons
      - name: Initialize the isolated Android project
        working-directory: apps/mobile
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Configure production signing without embedding credentials in source
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re
          from pathlib import Path
          for name in ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS',
                       'ANDROID_KEY_PASSWORD', 'ANDROID_SIGNING_CERT_SHA256']:
              if not os.environ.get(name):
                  raise SystemExit('Missing a required mobile-release signing secret')
          fingerprint = os.environ['ANDROID_SIGNING_CERT_SHA256'].replace(':', '').lower()
          if not re.fullmatch('[a-f0-9]{64}', fingerprint):
              raise SystemExit('Invalid expected production certificate fingerprint')
          certificate = json.loads(Path('apps/mobile/signing-certificate.json').read_text())
          config = json.loads(Path('apps/mobile/src-tauri/tauri.conf.json').read_text())
          if certificate.get('identifier') != config['identifier'] or certificate.get('certificate_sha256') != fingerprint:
              raise SystemExit('Signing secret differs from the reviewed persistent production identity')
          key = Path(os.environ['RUNNER_TEMP']) / 'minerdesk-mobile-release.p12'
          material = base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True)
          with os.fdopen(os.open(key, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as output:
              output.write(material)
          gradle = Path('apps/mobile/src-tauri/gen/android/app/build.gradle.kts')
          text = gradle.read_text()
          if 'minerdeskProductionSigning' in text or 'buildTypes' not in text:
              raise SystemExit('Unexpected generated Android build configuration')
          text += '''
          // minerdeskProductionSigning: generated only inside the protected release job.
          // https://v2.tauri.app/distribute/sign/android/
          android {
              signingConfigs {
                  create("minerdeskProduction") {
                      storeFile = file(System.getenv("MD_ANDROID_KEYSTORE") ?: error("Missing production keystore"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: error("Missing store password")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: error("Missing signing alias")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: error("Missing key password")
                      storeType = "PKCS12"
                      enableV2Signing = true
                      enableV3Signing = true
                  }
              }
              buildTypes.getByName("release") {
                  signingConfig = signingConfigs.getByName("minerdeskProduction")
                  isDebuggable = false
              }
          }
          '''
          gradle.write_text(text)
          PY
      - name: Build APKs with the persistent production certificate
        working-directory: apps/mobile
        env:
          MD_ANDROID_KEYSTORE: ${{ runner.temp }}/minerdesk-mobile-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run tauri -- android build --apk --split-per-abi --target aarch64 --target x86_64 --ci
      - name: Verify production signatures, manifests, ABIs and source provenance
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          git diff --exit-code -- apps/mobile/core/Cargo.lock apps/mobile/src-tauri/Cargo.lock
          python3 scripts/mobile-release-artifacts.py --source-commit "$GITHUB_SHA"
      - name: Upload only verified public release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minerdesk-mobile-android-release
          path: publish/mobile-android-release/
          if-no-files-found: error
          retention-days: 30
      - name: Remove the temporary private signing file
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          key = root / 'minerdesk-mobile-release.p12'
          if key.parent != root:
              raise SystemExit('Signing cleanup escaped the runner temporary directory')
          key.unlink(missing_ok=True)
          PY
