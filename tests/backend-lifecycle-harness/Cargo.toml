[package]
name = "minerdesk-backend-lifecycle-harness"
version = "0.0.0"
edition = "2021"
publish = false

# Run the production lifecycle tests before the much larger Tauri build.
[dependencies]
serde_json = "=1.0.151"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
